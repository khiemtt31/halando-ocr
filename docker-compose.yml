services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--http-port=8080", "--hostname=localhost", "--hostname-strict=false", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "8000:8000"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    depends_on:
      keycloak:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: ["watchfiles", "--filter", "python", "python -m app.workers.ocr_worker", "/app/app"]
    depends_on:
      api:
        condition: service_started
